<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>For Himani 🌹</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>
  
<div class="stars"></div>

<div class="title">For Himani 🌹</div>
<div class="subtitle" id="subtitle">Click the flower ✨</div>

<div class="wrapper" id="flower" role="button" tabindex="0" aria-label="Magic flower - click to bloom">
  
  <!-- Glow Effect -->
  <div class="glow"></div>
  
  <!-- Stem and Leaves -->
  <div class="stem">
    <div class="leaf left"></div>
    <div class="leaf right"></div>
    <div class="leaf small left-small"></div>
    <div class="leaf small right-small"></div>
  </div>
  
  <!-- Center of Flower -->
  <div class="center"></div>
  
  <!-- Petals -->
  <div class="petal" style="--r:0deg; --delay:0ms"></div>
  <div class="petal" style="--r:45deg; --delay:100ms"></div>
  <div class="petal" style="--r:90deg; --delay:200ms"></div>
  <div class="petal" style="--r:135deg; --delay:300ms"></div>
  <div class="petal" style="--r:180deg; --delay:400ms"></div>
  <div class="petal" style="--r:225deg; --delay:500ms"></div>
  <div class="petal" style="--r:270deg; --delay:600ms"></div>
  <div class="petal" style="--r:315deg; --delay:700ms"></div>
  
  <!-- Inner Petals -->
  <div class="petal inner" style="--r:22.5deg; --delay:800ms"></div>
  <div class="petal inner" style="--r:67.5deg; --delay:900ms"></div>
  <div class="petal inner" style="--r:112.5deg; --delay:1000ms"></div>
  <div class="petal inner" style="--r:157.5deg; --delay:1100ms"></div>
  <div class="petal inner" style="--r:202.5deg; --delay:1200ms"></div>
  <div class="petal inner" style="--r:247.5deg; --delay:1300ms"></div>
  <div class="petal inner" style="--r:292.5deg; --delay:1400ms"></div>
  <div class="petal inner" style="--r:337.5deg; --delay:1500ms"></div>

</div>

<div class="message" id="loveMsg">
  You make my world bloom 🌹<br>
  <span class="heart-text">Every moment with you is magical ✨</span>
</div>

<div class="instruction" id="instruction">✨ Tap the flower to begin ✨</div>

<audio id="bgMusic" loop preload="auto">
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_c8c8a73467.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
